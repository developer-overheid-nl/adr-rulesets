name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # push the release commit back to main
  id-token: write # npm trusted publishing + provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Verify tag points at main
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must point at the latest commit on main"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Apply changesets
        run: pnpm changeset version
      - name: Verify version matches tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$TAG" != "$VERSION" ]]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION after applying changesets"
            exit 1
          fi
      - run: pnpm dedupe --check
      - run: pnpm build
      - run: pnpm lint
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            pnpm publish --provenance --no-git-checks --tag beta
          else
            pnpm publish --provenance --no-git-checks
          fi
